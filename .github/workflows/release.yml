name: Release

# Publishes a version to Maven Central, creates its signed tag and the GitHub release.
#
# Triggers:
#   - A pull request labeled `release` is merged into master. The project version must not be a
#     -SNAPSHOT and the tag must not exist yet. The tag is created here, signed with the release key.
#   - A tag vX.Y.Z is pushed manually. The tag must match the project version.
# In both cases CHANGELOG.md must have a dated section for the version: `## [X.Y.Z] - YYYY-MM-DD`.
#
# Every step is idempotent: a version already on Maven Central is not deployed again, and an
# existing tag or GitHub release is kept. After a failure, re-run the failed jobs.
#
# Tags pushed with GITHUB_TOKEN do not trigger workflows, so the tag created here does not start a
# second run.
#
# Secrets of the `maven-central` environment:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD  user token from https://central.sonatype.com/account
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE     armored release key, also registered on GitHub
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Decide whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] \
              || fail "Tag $GITHUB_REF_NAME does not match project version $version"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0].labels[]?.name')
            if ! printf '%s\n' "$labels" | grep -qx release; then
              echo "No release label on the merged pull request; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$version" in
              *-SNAPSHOT) fail "The pull request is labeled release, but the version is $version" ;;
            esac
            # An existing tag is fine only on this commit, when a failed run is re-run.
            tagged=$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              fail "Tag v$version already exists on another commit"
            fi
          fi

          grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md \
            || fail "CHANGELOG.md has no dated section '## [$version] - YYYY-MM-DD'"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Check Maven Central
        id: central
        run: |
          url="https://repo1.maven.org/maven2/io/github/allanhladki/flat2java/flat2java-core/$VERSION/flat2java-core-$VERSION.pom"
          if curl -fsSI "$url" > /dev/null; then
            echo "Version $VERSION is already on Maven Central; skipping the deployment."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.central.outputs.published == 'false'
        run: mvn -B -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create the signed tag
        if: github.ref_type == 'branch'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Tagger name, email and key come from the release key, so GitHub shows the tag as verified.
          trap 'rm -f "$RUNNER_TEMP/gpg-passphrase"' EXIT
          uid=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "uid" { print $10; exit }')
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          git config user.name "${uid% <*}"
          git config user.email "$(printf '%s' "$uid" | sed 's/.*<\(.*\)>.*/\1/')"
          git config user.signingkey "$fingerprint"

          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase-file "%s" "$@"\n' \
            "$RUNNER_TEMP/gpg-passphrase" > "$RUNNER_TEMP/gpg-sign"
          chmod 700 "$RUNNER_TEMP/gpg-sign"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists."
            exit 0
          fi
          git -c gpg.program="$RUNNER_TEMP/gpg-sign" \
            tag -s "v$VERSION" -m "flat2java $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          # The CHANGELOG section of this version, without its heading and link references.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --verify-tag --title "flat2java $VERSION" --notes-file notes.md
